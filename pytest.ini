[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --ignore=tests/local_bronze (OP-TST/ACT_9016, Problema A): quella dir e' l'harness
# dell'ingestion bronze (diag_*, run_notebook, spark_session), NON i guardrail. I suoi
# test_watermark.py / test_bronze_pruning.py eseguono Spark SQL a import-time con FQN a
# 3 parti (control_dev.etl.*) validi solo su Unity Catalog: in locale la collection
# restava impiccata ~28 min e poi abortiva. Escludendola, `pytest` gira pulito sui 5 file guardrail.
addopts = -v --tb=short --ignore=tests/local_bronze
# Sopprime i log Spark/Delta dall'output dei test
log_cli = false
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
